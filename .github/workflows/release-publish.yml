name: Release Publish DMG

on:
  workflow_dispatch:
    inputs:
      version:
        description: App version to publish. The workflow must be run from tag v<version>.
        required: true
        default: "0.2.0"
      previous_release_ref:
        description: Git ref for the previous public release used to draft the release PR analysis and delta checklist.
        required: true
        default: "v0.1.11"
      expected_rhwp_tag:
        description: rhwp release tag that must match rhwp-core.lock before publishing.
        required: true
        default: "v0.8.6"
      require_latest_rhwp:
        description: Fail if rhwp-core.lock is not pinned to upstream latest release.
        required: true
        type: boolean
        default: true
      include_rhwp_in_title:
        description: Append (rhwp vX.Y.Z) to the GitHub Release title for upstream rhwp-centered releases.
        required: true
        type: boolean
        default: false
      draft:
        description: Must be true. Use Release Promote Verified DMG after candidate validation.
        required: true
        type: boolean
        default: true
      prerelease:
        description: Must be false for a stable release candidate.
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-publish-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish-dmg:
    name: Build signed/notarized draft DMG
    runs-on: macos-15
    timeout-minutes: 180
    environment: release
    permissions:
      contents: write
      pull-requests: read

    env:
      VERSION: ${{ inputs.version }}
      PREVIOUS_RELEASE_REF: ${{ inputs.previous_release_ref }}
      EXPECTED_RHWP_TAG: ${{ inputs.expected_rhwp_tag }}
      REQUIRE_LATEST_RHWP: ${{ inputs.require_latest_rhwp }}
      INCLUDE_RHWP_IN_TITLE: ${{ inputs.include_rhwp_in_title }}
      DRAFT_RELEASE: ${{ inputs.draft }}
      PRERELEASE: ${{ inputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
      ALHANGEUL_BUILD_ROOT: ${{ github.workspace }}/build.noindex
      ALHANGEUL_DEVELOPER_ID_APPLICATION: ${{ vars.ALHANGEUL_DEVELOPER_ID_APPLICATION }}
      ALHANGEUL_DEVELOPER_ID_DMG: ${{ vars.ALHANGEUL_DEVELOPER_ID_DMG }}
      ALHANGEUL_NOTARY_PROFILE: ${{ vars.ALHANGEUL_NOTARY_PROFILE }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
      DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
      DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_APP_SPECIFIC_PASSWORD: ${{ secrets.NOTARY_APP_SPECIFIC_PASSWORD }}
      RELEASE_KEYCHAIN_PASSWORD: ${{ secrets.RELEASE_KEYCHAIN_PASSWORD }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up Python for golden contract helpers
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Require a new stable draft candidate
        shell: bash
        run: |
          set -euo pipefail
          if [ "$DRAFT_RELEASE" != true ] || [ "$PRERELEASE" != false ]; then
            echo 'Only draft=true/prerelease=false is allowed; public releases use Release Promote Verified DMG.' >&2
            exit 1
          fi
          # A failed lookup cannot authorize overwriting: gh release create is the final guard.
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo 'A Release already exists. Preserve it; explicitly withdraw an invalid draft before creating a new candidate.' >&2
            exit 1
          fi

      - name: Verify main/devel release content invariant
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main +refs/heads/devel:refs/remotes/origin/devel
          scripts/ci/check-main-devel-content.sh origin/main origin/devel

      - name: Install release validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            brew install ripgrep
          fi

      - name: Validate release inputs and tag ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: version must look like semantic version, got: $VERSION" >&2
            exit 1
          fi

          tag_name="v$VERSION"
          if [ "$GITHUB_REF_TYPE" != "tag" ] || [ "$GITHUB_REF_NAME" != "$tag_name" ]; then
            echo "ERROR: release publish must run from tag $tag_name; got $GITHUB_REF" >&2
            exit 1
          fi

          tag_commit="$(git rev-list -n 1 "$tag_name")"
          head_commit="$(git rev-parse HEAD)"
          if [ "$tag_commit" != "$head_commit" ]; then
            echo "ERROR: checked out HEAD $head_commit does not match $tag_name $tag_commit" >&2
            exit 1
          fi

          {
            echo "## Release ref"
            echo
            echo "- version: \`$VERSION\`"
            echo "- tag: \`$tag_name\`"
            echo "- commit: \`$head_commit\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write release PR analysis
        id: pr_analysis
        shell: bash
        run: |
          set -euo pipefail
          candidate_ref="v$VERSION"
          analysis_path="$ALHANGEUL_BUILD_ROOT/release/pr-analysis-$VERSION.md"

          scripts/ci/write-release-pr-analysis.sh \
            "$PREVIOUS_RELEASE_REF" \
            "$candidate_ref" \
            "$analysis_path"
          scripts/validate-github-body.sh "$analysis_path"

          {
            echo "analysis_path=$analysis_path"
            echo "previous_release_ref=$PREVIOUS_RELEASE_REF"
            echo "candidate_ref=$candidate_ref"
          } >> "$GITHUB_OUTPUT"

          {
            echo
            echo "## Release PR analysis"
            echo
            echo "- previous release ref: \`$PREVIOUS_RELEASE_REF\`"
            echo "- candidate ref: \`$candidate_ref\`"
            echo "- analysis path: \`$analysis_path\`"
            echo
            echo "This PR/Issue/report draft is the primary input for release note review. The release owner must classify each PR before publishing public wording."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release PR analysis artifact
        uses: actions/upload-artifact@v7
        with:
          name: alhangeul-macos-${{ inputs.version }}-release-pr-analysis
          path: ${{ steps.pr_analysis.outputs.analysis_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Write release delta checklist
        id: delta
        shell: bash
        run: |
          set -euo pipefail
          candidate_ref="v$VERSION"
          checklist_path="$ALHANGEUL_BUILD_ROOT/release/delta-checklist-$VERSION.md"

          scripts/ci/write-release-delta-checklist.sh \
            "$PREVIOUS_RELEASE_REF" \
            "$candidate_ref" \
            "$checklist_path"

          {
            echo "checklist_path=$checklist_path"
            echo "previous_release_ref=$PREVIOUS_RELEASE_REF"
            echo "candidate_ref=$candidate_ref"
          } >> "$GITHUB_OUTPUT"

          {
            echo
            echo "## Release delta checklist"
            echo
            echo "- previous release ref: \`$PREVIOUS_RELEASE_REF\`"
            echo "- candidate ref: \`$candidate_ref\`"
            echo "- checklist path: \`$checklist_path\`"
            echo
            echo "This path-based draft is a secondary aid for missing impact/smoke checks and must not replace PR analysis."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release delta checklist artifact
        uses: actions/upload-artifact@v7
        with:
          name: alhangeul-macos-${{ inputs.version }}-release-delta-checklist
          path: ${{ steps.delta.outputs.checklist_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Read and validate core lock
        id: core
        shell: bash
        run: |
          set -euo pipefail
          rhwp_tag="$(bash scripts/ci/read-rhwp-core-lock.sh rhwp_release_tag)"
          rhwp_commit="$(bash scripts/ci/read-rhwp-core-lock.sh rhwp_commit)"

          {
            echo "rhwp_tag=$rhwp_tag"
            echo "rhwp_commit=$rhwp_commit"
          } >> "$GITHUB_OUTPUT"

          if [ "$rhwp_tag" != "$EXPECTED_RHWP_TAG" ]; then
            echo "ERROR: expected rhwp tag $EXPECTED_RHWP_TAG but rhwp-core.lock has $rhwp_tag" >&2
            exit 1
          fi

          {
            echo "## rhwp core"
            echo
            echo "- lock tag: \`$rhwp_tag\`"
            echo "- lock commit: \`$rhwp_commit\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify upstream latest rhwp release
        if: ${{ inputs.require_latest_rhwp }}
        shell: bash
        run: |
          set -euo pipefail
          latest_tag="$(gh release view -R edwardkim/rhwp --json tagName --jq .tagName)"
          lock_tag="${{ steps.core.outputs.rhwp_tag }}"

          if [ "$lock_tag" != "$latest_tag" ]; then
            echo "ERROR: rhwp-core.lock has $lock_tag but upstream latest is $latest_tag" >&2
            echo "Update rhwp core compatibility before publishing, or rerun with require_latest_rhwp=false for an explicit exception." >&2
            exit 1
          fi

          {
            echo
            echo "- upstream latest rhwp release: \`$latest_tag\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          if ! command -v cbindgen >/dev/null 2>&1; then
            brew install cbindgen
          fi
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Import Developer ID certificate
        id: keychain
        shell: bash
        run: |
          set -euo pipefail
          keychain_path="$(bash scripts/ci/import-developer-id-certificate.sh)"
          echo "keychain_path=$keychain_path" >> "$GITHUB_OUTPUT"

      - name: Store notarization credential
        shell: bash
        run: |
          set -euo pipefail
          for required in ALHANGEUL_NOTARY_PROFILE APPLE_TEAM_ID NOTARY_APPLE_ID NOTARY_APP_SPECIFIC_PASSWORD; do
            if [ -z "${!required:-}" ]; then
              echo "ERROR: $required is required for release notarization" >&2
              exit 1
            fi
          done

          xcrun notarytool store-credentials "$ALHANGEUL_NOTARY_PROFILE" \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$NOTARY_APP_SPECIFIC_PASSWORD" \
            --keychain "${{ steps.keychain.outputs.keychain_path }}"

      - name: Verify release script interface
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/release.sh --help

      - name: Record Rust bridge lock policy
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Rust bridge lock policy"
            echo
            echo "- lock command: \`./scripts/build-rust-macos.sh --verify-portable\`"
            echo "- golden command: \`./scripts/verify-render-tree-golden.sh\` (verify only)"
            echo "- build info command: \`./scripts/verify-rhwp-core-build-info.sh\`"
            echo "- verification mode: portable (explicit --verify-portable)"
            echo "- Portable mode excludes only staticlib byte hash/size comparison; reference metadata remains required."
            echo "- Source provenance, Cargo lock, generated header, and FFI symbol checks still run."
            echo "- Swift core build info must match the locked release baseline, commit, and enabled features."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record signing preflight policy
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Signing preflight policy"
            echo
            echo "- release command: \`./scripts/release.sh \"$VERSION\"\`"
            echo "- Expected Team ID: \`${APPLE_TEAM_ID:-XH6JHKYXV8}\`"
            echo "- The copied Release app endpoint must match the approved production endpoint before post-build Developer ID re-signing, notarization submit, and DMG creation."
            echo "- Before app notarization submit, \`release.sh\` verifies Developer ID authority, Team ID, secure timestamp, hardened runtime, \`get-task-allow\` absence, and required Sparkle nested components."
            echo "- Failure in this preflight blocks notarization submit."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify rhwp source, header, ABI lock, and build info
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/build-rust-macos.sh --verify-portable
          ./scripts/verify-rhwp-core-build-info.sh
          ./scripts/verify-render-tree-golden.sh

      - name: Build signed and notarized DMG
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/release.sh "$VERSION"

      - name: Verify public release artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          dmg_name="alhangeul-macos-$VERSION.dmg"
          release_dir="$PWD/build.noindex/release"
          dmg_path="$release_dir/$dmg_name"
          checksum_path="$dmg_path.sha256"

          test -f "$dmg_path"
          test -f "$checksum_path"
          (cd "$release_dir" && shasum -a 256 -c "$dmg_name.sha256")

          digest="$(awk '{print $1}' "$checksum_path")"
          {
            echo "dmg_path=$dmg_path"
            echo "checksum_path=$checksum_path"
            echo "digest=$digest"
            echo "notes_path=$release_dir/release-notes-$VERSION.md"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Public release artifact"
            echo
            echo "- DMG: \`$dmg_name\`"
            echo "- SHA256: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/write-release-notes.sh \
            "$VERSION" \
            "${{ steps.artifact.outputs.digest }}" \
            "${{ steps.artifact.outputs.notes_path }}"

      - name: Create immutable draft Release assets
        shell: bash
        env:
          RHWP_TAG: ${{ steps.core.outputs.rhwp_tag }}
          DMG_PATH: ${{ steps.artifact.outputs.dmg_path }}
          CHECKSUM_PATH: ${{ steps.artifact.outputs.checksum_path }}
          NOTES_PATH: ${{ steps.artifact.outputs.notes_path }}
        run: |
          set -euo pipefail
          release_title="Alhangeul v$VERSION"
          if [ "$INCLUDE_RHWP_IN_TITLE" = true ]; then
            release_title="$release_title (rhwp $RHWP_TAG)"
          fi
          # create fails when the tag already has a Release; never overwrite assets.
          gh release create "v$VERSION" "$DMG_PATH" "$CHECKSUM_PATH" \
            --title "$release_title" --notes-file "$NOTES_PATH" --verify-tag --draft
          echo 'Draft only. Validate this artifact, then use Release Promote Verified DMG.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed DMG artifact copy
        uses: actions/upload-artifact@v7
        with:
          name: alhangeul-macos-${{ inputs.version }}-public-dmg
          path: |
            ${{ steps.artifact.outputs.dmg_path }}
            ${{ steps.artifact.outputs.checksum_path }}
            ${{ steps.artifact.outputs.notes_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Delete temporary release keychain
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          security delete-keychain "$RUNNER_TEMP/alhangeul-release.keychain-db" || true
