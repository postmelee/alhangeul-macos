name: PR CI

on:
  pull_request:
    branches:
      - main
      - devel
      - native-viewer-editor

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify-changes:
    name: Classify changed files
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      run_macos_build: ${{ steps.classify.outputs.run_macos_build }}
      run_rust_verify: ${{ steps.classify.outputs.run_rust_verify }}
      run_render_smoke: ${{ steps.classify.outputs.run_render_smoke }}
      run_release_checks: ${{ steps.classify.outputs.run_release_checks }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/classify-pr-changes.sh \
            "${{ github.event.pull_request.base.sha }}" \
            HEAD

  script-checks:
    name: Script syntax checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: classify-changes

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python for golden contract helpers
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check Python helper syntax
        shell: bash
        run: python3 -m compileall -q scripts/ci

      - name: Check shell script syntax
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/*.sh scripts/ci/*.sh; do
            bash -n "$script"
          done

      - name: Check workflow YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "psych"; Dir[".github/workflows/*.yml"].sort.each { |path| Psych.parse_file(path); puts "Parsed #{path}" }'

      - name: Check issue template YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "psych"; Dir[".github/ISSUE_TEMPLATE/*.yml"].sort.each { |path| Psych.parse_file(path); puts "Parsed #{path}" }'

      - name: Check helper interfaces
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/classify-pr-changes.sh --help
          bash scripts/ci/check-main-devel-content.sh --help
          bash scripts/ci/check-rhwp-upstream-release.sh --help
          bash scripts/ci/detect-rhwp-studio-impact.sh --help
          bash scripts/ci/prepare-pages-artifact.sh --help
          bash scripts/ci/read-rhwp-core-lock.sh --help
          bash scripts/ci/test-render-tree-decoder.sh --help
          bash scripts/ci/update-release-version-notices.sh --help
          bash scripts/ci/verify-app-execution-endpoint-config.sh --help
          bash scripts/ci/write-rhwp-full-sync-pr-body.sh --help
          bash scripts/ci/write-rhwp-studio-sync-pr-body.sh --help
          bash scripts/ci/write-sparkle-appcast.sh --help
          bash scripts/sync-rhwp-studio.sh --help
          bash scripts/update-rhwp-core-build-info.sh --help
          bash scripts/verify-rhwp-core-build-info.sh --help
          bash scripts/update-render-tree-golden.sh --help
          bash scripts/verify-render-tree-golden.sh --help
          bash scripts/verify-rhwp-studio-assets.sh --help

      - name: Check main/devel content gate fixtures
        shell: bash
        run: python3 scripts/ci/test-main-devel-content.py

      - name: Check render tree golden helper fixtures
        shell: bash
        run: python3 scripts/ci/test-render-tree-golden.py

      - name: Check Rust verification mode fixtures
        shell: bash
        run: python3 scripts/ci/test-rust-verification-modes.py

      - name: Check core build info helper fixtures
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/test-rhwp-core-build-info.sh

      - name: Check studio Cargo.lock verification fixtures
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/test-rhwp-studio-cargo-lock-verification.sh

      - name: Check analytics endpoint configuration fixtures
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/test-app-execution-endpoint-config.sh

      - name: Verify tracked core build info
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/verify-rhwp-core-build-info.sh

      - name: Check release note version notices
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/update-release-version-notices.sh --updates-dir docs/updates --check

      - name: Record classification summary
        shell: bash
        run: |
          {
            echo "## PR CI scope"
            echo
            echo "| Flag | Value |"
            echo "|------|-------|"
            echo "| docs_only | \`${{ needs.classify-changes.outputs.docs_only }}\` |"
            echo "| run_macos_build | \`${{ needs.classify-changes.outputs.run_macos_build }}\` |"
            echo "| run_rust_verify | \`${{ needs.classify-changes.outputs.run_rust_verify }}\` |"
            echo "| run_render_smoke | \`${{ needs.classify-changes.outputs.run_render_smoke }}\` |"
            echo "| run_release_checks | \`${{ needs.classify-changes.outputs.run_release_checks }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify main content is incorporated in the PR source
        if: ${{ github.base_ref == 'main' || github.base_ref == 'devel' }}
        shell: bash
        env:
          PR_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          scripts/ci/check-main-devel-content.sh origin/main "$PR_SOURCE_SHA"

  macos-validation:
    name: macOS validation
    runs-on: macos-15
    timeout-minutes: 120
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.run_macos_build == 'true' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python for golden contract helpers
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify render tree decoder compatibility
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/test-render-tree-decoder.sh

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          if ! command -v cbindgen >/dev/null 2>&1; then
            brew install cbindgen
          fi

      - name: Record Rust bridge lock policy
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Rust bridge lock policy"
            echo
            echo "- run_rust_verify: \`${{ needs.classify-changes.outputs.run_rust_verify }}\`"
            echo "- verification mode: portable (explicit --verify-portable)"
            echo "- Portable mode excludes only staticlib byte hash/size comparison; reference metadata remains required."
            echo "- Source provenance, Cargo lock, generated header, and FFI symbol checks still run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify pinned producer golden and Swift decoder
        shell: bash
        run: scripts/verify-render-tree-golden.sh

      - name: Prepare Rust bridge artifacts
        shell: bash
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          if [ "${{ needs.classify-changes.outputs.run_rust_verify }}" = "true" ]; then
            ./scripts/build-rust-macos.sh --verify-portable
          else
            ./scripts/build-rust-macos.sh
          fi

      - name: Check Rust bridge contracts
        if: ${{ needs.classify-changes.outputs.run_rust_verify == 'true' }}
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: |
          set -euo pipefail
          bridge_test_target="$(rustc -vV | awk '/^host:/ {print $2}')"
          cargo test --manifest-path RustBridge/Cargo.toml --locked --offline --release --target "$bridge_test_target"

      - name: Check shared Swift boundary
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/check-no-appkit.sh

      - name: Verify core build info
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/verify-rhwp-core-build-info.sh

      - name: Verify bundled rhwp-studio assets
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/verify-rhwp-studio-assets.sh

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate

      - name: Build HostApp Debug
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project Alhangeul.xcodeproj \
            -scheme HostApp \
            -configuration Debug \
            -derivedDataPath build.noindex/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify HostApp Debug analytics endpoint
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/verify-app-execution-endpoint-config.sh \
            --debug-app build.noindex/DerivedData/Build/Products/Debug/Alhangeul.app

      - name: Run native renderer smoke
        if: ${{ needs.classify-changes.outputs.run_render_smoke == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/validate-stage3-render.sh

  release-checks:
    name: Release helper checks
    runs-on: macos-15
    timeout-minutes: 45
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.run_release_checks == 'true' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install release validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            brew install ripgrep
          fi

      - name: Check analytics endpoint plist fixtures on macOS
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/test-app-execution-endpoint-config.sh

      - name: Fetch release tags
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

      - name: Verify release script interface
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/release.sh --help

      - name: Verify release note template
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/write-release-notes.sh \
            0.1.5 \
            0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            build.noindex/release/release-notes-0.1.5.md
          scripts/ci/check-release-notes-template.sh \
            build.noindex/release/release-notes-0.1.5.md
          scripts/validate-github-body.sh \
            build.noindex/release/release-notes-0.1.5.md

      - name: Verify release PR analysis helper
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scripts/ci/write-release-pr-analysis.sh \
            v0.1.4 \
            HEAD \
            build.noindex/release/pr-analysis-0.1.5.md
          scripts/validate-github-body.sh \
            build.noindex/release/pr-analysis-0.1.5.md

      - name: Verify release delta checklist
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/write-release-delta-checklist.sh \
            v0.1.4 \
            HEAD \
            build.noindex/release/delta-checklist-0.1.5.md

      - name: Verify Sparkle appcast helper
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/write-sparkle-appcast.sh \
            --version 0.1.3 \
            --build 9 \
            --dmg-url https://github.com/postmelee/alhangeul-macos/releases/download/v0.1.3/alhangeul-macos-0.1.3.dmg \
            --length 1 \
            --ed-signature dummy-ed-signature \
            --release-notes-url https://postmelee.github.io/alhangeul-macos/updates/v0.1.3.html \
            --pub-date "Fri, 08 May 2026 09:00:00 +0000" \
            --minimum-system-version 12.0 \
            --output build.noindex/release/appcast.xml
          xmllint --noout build.noindex/release/appcast.xml

      - name: Verify Pages artifact helper
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/prepare-pages-artifact.sh \
            --docs-dir docs \
            --appcast build.noindex/release/appcast.xml \
            --output-dir build.noindex/release/pages-artifact
          xmllint --noout build.noindex/release/pages-artifact/appcast.xml
          test -f build.noindex/release/pages-artifact/index.html
          test -f build.noindex/release/pages-artifact/updates/index.html

      - name: Record release check summary
        shell: bash
        run: |
          {
            echo "## Release helper checks"
            echo
            echo "- release script help: OK"
            echo "- release notes dry-run/template check: OK"
            echo "- release PR analysis helper dry-run: OK"
            echo "- release delta checklist dry-run: OK"
            echo "- Sparkle appcast helper dry-run: OK"
            echo "- Pages artifact helper dry-run: OK"
          } >> "$GITHUB_STEP_SUMMARY"
