[package]
name = "rhwp_mac_bridge"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
rhwp = { git = "https://github.com/edwardkim/rhwp.git", tag = "v0.8.7", features = ["native-skia"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
ttf-parser = "0.25.1"
