name: Alhangeul
options:
  bundleIdPrefix: com.postmelee
  deploymentTarget:
    macOS: "12.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "12.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.1
targets:
  HostApp:
    type: application
    platform: macOS
    sources:
      - path: Sources/HostApp
        excludes:
          - Resources/rhwp-studio
          - Resources/Legal
      - path: Sources/HostApp/Resources/Legal
        type: folder
      - path: Sources/HostApp/Resources/rhwp-studio
        type: folder
      - path: Sources/Shared
      - path: Sources/RhwpCoreBridge
    dependencies:
      - target: QLExtension
        embed: true
      - target: ThumbnailExtension
        embed: true
      - framework: Frameworks/Rhwp.xcframework
        embed: false
      - sdk: CoreFoundation.framework
      - sdk: CoreText.framework
      - sdk: CoreGraphics.framework
      - sdk: Foundation.framework
      - sdk: ImageIO.framework
      - sdk: CoreServices.framework
      - sdk: Network.framework
      - sdk: ApplicationServices.framework
      - sdk: Security.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: IOSurface.framework
      - sdk: ColorSync.framework
      - sdk: libc++.tbd
      - sdk: libiconv.tbd
      - sdk: libz.tbd
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_NAME: Alhangeul
        EXECUTABLE_NAME: Alhangeul
        PRODUCT_BUNDLE_IDENTIFIER: com.postmelee.alhangeul
        INFOPLIST_FILE: Sources/HostApp/Info.plist
        ALHANGEUL_APP_EXECUTION_ENDPOINT: ""
        CODE_SIGN_ENTITLEMENTS: Sources/HostApp/HostApp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
      configs:
        Release:
          ALHANGEUL_APP_EXECUTION_ENDPOINT: https://alhangeul-install-events.postmelee.workers.dev/v1/install-events

  QLExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/QLExtension
      - path: Sources/Shared
      - path: Sources/RhwpCoreBridge
    dependencies:
      - framework: Frameworks/Rhwp.xcframework
        embed: false
      - sdk: CoreFoundation.framework
      - sdk: CoreText.framework
      - sdk: CoreGraphics.framework
      - sdk: Foundation.framework
      - sdk: ImageIO.framework
      - sdk: CoreServices.framework
      - sdk: ApplicationServices.framework
      - sdk: Security.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: IOSurface.framework
      - sdk: ColorSync.framework
      - sdk: libc++.tbd
      - sdk: libiconv.tbd
      - sdk: libz.tbd
    settings:
      base:
        PRODUCT_NAME: AlhangeulPreview
        EXECUTABLE_NAME: AlhangeulPreview
        PRODUCT_BUNDLE_IDENTIFIER: com.postmelee.alhangeul.QLExtension
        INFOPLIST_FILE: Sources/QLExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/QLExtension/QLExtension.entitlements
        CODE_SIGN_STYLE: Automatic

  ThumbnailExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/ThumbnailExtension
      - path: Sources/Shared
      - path: Sources/RhwpCoreBridge
    dependencies:
      - framework: Frameworks/Rhwp.xcframework
        embed: false
      - sdk: CoreFoundation.framework
      - sdk: CoreText.framework
      - sdk: CoreGraphics.framework
      - sdk: Foundation.framework
      - sdk: ImageIO.framework
      - sdk: CoreServices.framework
      - sdk: ApplicationServices.framework
      - sdk: Security.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: IOSurface.framework
      - sdk: ColorSync.framework
      - sdk: libc++.tbd
      - sdk: libiconv.tbd
      - sdk: libz.tbd
    settings:
      base:
        PRODUCT_NAME: AlhangeulThumbnail
        EXECUTABLE_NAME: AlhangeulThumbnail
        PRODUCT_BUNDLE_IDENTIFIER: com.postmelee.alhangeul.ThumbnailExtension
        INFOPLIST_FILE: Sources/ThumbnailExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/ThumbnailExtension/ThumbnailExtension.entitlements
        CODE_SIGN_STYLE: Automatic

  HostAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/HostAppTests
      - path: Sources/HostApp/Services/AppExecutionAnalyticsState.swift
      - path: Sources/HostApp/Services/AppExecutionAnalyticsRuntime.swift
      - path: Sources/HostApp/Services/AppExecutionEvent.swift
      - path: Sources/HostApp/Services/AppExecutionOutbox.swift
      - path: Sources/HostApp/Services/DocumentOpenRecoveryState.swift
      - path: Sources/HostApp/Services/DocumentSaveContract.swift
      - path: Sources/HostApp/Services/DocumentSaveFormat.swift
      - path: Sources/HostApp/Services/QuickLookConflictDetector.swift
      - path: Sources/HostApp/Services/QuickLookConflictNoticePolicy.swift
      - path: Sources/HostApp/Services/QuickLookConflictPresentation.swift
      - path: Sources/HostApp/Services/QuickLookSettingsOpener.swift
      - path: Sources/HostApp/Services/RhwpStudioHostBridgeScript.swift
      - path: Sources/HostApp/Services/RhwpStudioPDFExportController.swift
      - path: Sources/HostApp/Services/RhwpStudioPDFFontProvider.swift
      - path: Sources/HostApp/Services/RhwpStudioPDFExportState.swift
      - path: Sources/HostApp/Services/RhwpStudioPagePDFRenderer.swift
      - path: Sources/HostApp/Services/RhwpStudioPagePayload.swift
      - path: Sources/HostApp/Services/RhwpStudioPrintLifecycle.swift
      - path: Sources/HostApp/Services/RhwpStudioPrintOrientationPolicy.swift
      - path: Sources/HostApp/Support/RhwpProvenance.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.postmelee.alhangeul.HostAppTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - sdk: Network.framework

  ExternalImageTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ExternalImageTests
      - path: Sources/Shared/HwpExternalImageResolver.swift
      - path: Sources/RhwpCoreBridge/RhwpDocument.swift
      - path: Sources/RhwpCoreBridge/RhwpDocumentProtection.swift
      - path: Sources/RhwpCoreBridge/RenderTree.swift
    dependencies:
      - framework: Frameworks/Rhwp.xcframework
        embed: false
      - sdk: CoreFoundation.framework
      - sdk: CoreText.framework
      - sdk: CoreGraphics.framework
      - sdk: Foundation.framework
      - sdk: ImageIO.framework
      - sdk: CoreServices.framework
      - sdk: ApplicationServices.framework
      - sdk: Security.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: IOSurface.framework
      - sdk: ColorSync.framework
      - sdk: libc++.tbd
      - sdk: libiconv.tbd
      - sdk: libz.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.postmelee.alhangeul.ExternalImageTests
        GENERATE_INFOPLIST_FILE: YES
